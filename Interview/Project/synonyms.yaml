# Fire/EMS synonym dictionary (editable).
#
# Each key is the normalized concept; the list holds the variants people actually
# type. Matching is case-insensitive and whole-word. Single-word variants are also
# matched typo-tolerantly (e.g. "toughbok" -> toughbook), see preprocess.fuzzy_threshold.
# Underscores in a key become spaces in the normalized text.

